<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Người Dùng | LMS System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body { background-color: #f4f7f6; font-family: 'Inter', sans-serif; }
        .card { border-radius: 15px; border: none; }
        .btn { border-radius: 10px; padding: 10px 18px; font-weight: 600; transition: all 0.3s ease; border: none; }
        
        .btn-filter { background: linear-gradient(45deg, #4e73df, #224abe); color: white; }
        .btn-filter:hover { background: linear-gradient(45deg, #224abe, #1a3a91); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(78, 115, 223, 0.4); color: white; }

        .btn-add { background: linear-gradient(45deg, #1cc88a, #13855c); color: white; }
        .btn-add:hover { background: linear-gradient(45deg, #13855c, #0e6345); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(28, 200, 138, 0.4); color: white; }

        .btn-reset { background-color: #eaecf4; color: #5a5c69; }
        .btn-reset:hover { background-color: #d1d3e2; color: #3a3b45; }
        .hover-shadow:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.1) !important;
            }
            .transition {
                transition: all 0.3s ease;
            }
            .icon-box {
                width: 45px;
                height: 45px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .user-info-card {
                background: linear-gradient(to right, #f8f9fa, #ffffff);
            }
            /* Tùy chỉnh thanh progress cho mịn */
            .progress-bar {
                transition: width 1s ease-in-out;
            }
        .form-control, .form-select { border-radius: 10px; padding: 10px 15px; border: 1px solid #d1d3e2; background-color: #f8f9fc; }
        .table thead th { background-color: #f8f9fc; color: #4e73df; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.1em; padding: 15px; }
        .user-avatar { width: 40px; height: 40px; object-fit: cover; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div id="sidebar-placeholder"></div>

<div class="container py-5">
    <!-- Tiêu đề thay đổi động theo Role -->
    <div class="mb-4">
        <h3 id="page-title" class="fw-bold text-dark m-0">Quản Lý Người Dùng</h3>
        <p id="page-subtitle" class="text-muted small">Quản lý học viên, giảng viên và phân quyền hệ thống</p>
    </div>

    <div class="card shadow-sm border-0 mb-4">
    <div class="card-body p-3"> 
        <div class="d-flex flex-wrap gap-2 mb-3">
            <div style="flex: 2; min-width: 250px;">
                <label class="form-label fw-semibold text-muted small mb-1">Từ khóa</label>
                <input type="text" id="keySearch" class="form-control form-control-sm bg-light" placeholder="Tìm tên hoặc email...">
            </div>

            <div class="admin-only" style="flex: 1; min-width: 130px; display:none;">
                <label class="form-label fw-semibold text-muted small mb-1">Vai trò</label>
                <select id="roleId" class="form-select form-select-sm bg-light">
                    <option value="-1">Tất cả</option>
                    <option value="2">Học viên</option>
                    <option value="3">Giảng viên</option>
                </select>
            </div>

            <div class="teacher-only" style="flex: 2; min-width: 200px; display:none;">
                <label class="form-label fw-semibold text-muted small mb-1">Khóa học của tôi</label>
                <select id="courseId" class="form-select form-select-sm bg-light">
                    <option value="-1">Tất cả khóa học</option>
                </select>
            </div>

            <div style="flex: 1; min-width: 140px;">
                <label class="form-label fw-semibold text-muted small mb-1">Từ ngày</label>
                <input type="date" id="fromDate" class="form-control form-control-sm bg-light">
            </div>
            <div style="flex: 1; min-width: 140px;">
                <label class="form-label fw-semibold text-muted small mb-1">Đến ngày</label>
                <input type="date" id="toDate" class="form-control form-control-sm bg-light">
            </div>

            <div class="admin-only" style="flex: 1; min-width: 130px; display:none;">
                <label class="form-label fw-semibold text-muted small mb-1">Trạng thái</label>
                <select id="isActive" class="form-select form-select-sm bg-light">
                    <option value="-1">Tất cả</option>
                    <option value="1">Hoạt động</option>
                    <option value="0">Bị khóa</option>
                </select>
            </div>
        </div>

        <div class="d-flex align-items-center justify-content-between border-top pt-3">
            <div id="bulk-actions" style="display: none;">
                <span class="text-muted small me-2"><span id="selected-count" class="fw-bold text-danger">0</span> đã chọn:</span>
                <button onclick="Manager.softDeleteBulk()" class="btn btn-sm btn-outline-danger px-3">
                    <i class="bi bi-trash-fill"></i> Xóa các mục đã chọn
                </button>
            </div>

            <div class="ms-auto d-flex align-items-center gap-2">
    <button onclick="Manager.loadData(1)" class="btn btn-dark px-3 rounded-pill fw-bold shadow-sm d-flex align-items-center" style="height: 38px; font-size: 13px;">
        <i class="bi bi-funnel-fill me-1"></i> LỌC DỮ LIỆU
    </button>
    
    <button onclick="Manager.resetSearch()" class="btn btn-white border rounded-pill px-3 fw-bold shadow-sm d-flex align-items-center" style="height: 38px; font-size: 13px; background: white;">
        <i class="bi bi-arrow-clockwise text-dark me-1"></i> LÀM MỚI
    </button>

    <div class="vr mx-1 opacity-25" style="height: 24px;"></div> 

    <button onclick="Manager.openCreateModal()" class="btn btn-primary px-3 rounded-pill fw-bold shadow-sm d-flex align-items-center admin-only" style="display: none; height: 38px; font-size: 13px;">
        <i class="bi bi-person-plus-fill me-1"></i> THÊM MỚI
    </button>
    
    <a href="user_trash.html" class="btn btn-outline-secondary px-3 rounded-pill fw-bold shadow-sm d-flex align-items-center" title="Quản lý thùng rác" style="height: 38px; font-size: 13px;">
        <i class="bi bi-trash3 me-1"></i> THÙNG RÁC
    </a>
</div>
        </div>
    </div>
</div>
    <!-- BẢNG DỮ LIỆU -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead id="table-header">
                        <!-- Render qua JavaScript -->
                    </thead>
                    <tbody id="user-table-body"></tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center p-4 border-top">
                <div class="small text-muted">Tổng số: <strong id="total-records">0</strong></div>
                <div id="pagination"><ul id="paging-ul" class="pagination pagination-sm m-0"></ul></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <form id="frmUser">
            <div class="modal-content shadow-lg border-0" style="border-radius: 15px;">
                <div class="modal-header border-bottom-0 pt-4 px-4">
                    <h5 class="modal-title fw-bold" id="modalTitle">Thông tin người dùng</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 pt-0">
                    
                    <!-- THANH MENU TABS -->
                    <ul class="nav nav-tabs nav-fill border-bottom mb-4 d-none" id="userModalTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-bold text-secondary" id="info-tab" data-bs-toggle="tab" data-bs-target="#tab-info" type="button" role="tab">
                                <i class="bi bi-info-circle me-1"></i> Thông tin tài khoản
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link fw-bold text-secondary" id="history-tab" data-bs-toggle="tab" data-bs-target="#tab-history" type="button" role="tab">
                                <i class="bi bi-cash-stack me-1"></i> Lịch sử giao dịch
                            </button>
                        </li>
                    </ul>

                    <!-- NỘI DUNG TABS -->
                    <div class="tab-content" id="userModalTabsContent">
                        
                        <!-- TAB 1: THÔNG TIN TÀI KHOẢN -->
                        <div class="tab-pane fade show active" id="tab-info" role="tabpanel">
                            <input type="hidden" id="userId" name="id">

                            <!-- Avatar Preview -->
                            <div class="text-center mb-4">
                                <img id="userAvatarPreview" src="../assets/img/default-avatar.png" 
                                     class="rounded-circle border shadow-sm" 
                                     style="width: 100px; height: 100px; object-fit: cover;">
                            </div>

                            <!-- Thêm class m-0 vào đây để vô hiệu hóa lề âm của Bootstrap -->
                            <div class="row g-3 m-0">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                                    <input type="text" id="fullName" name="fullName" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                                    <input type="email" id="emailInput" name="emailInput" class="form-control" required readonly>
                                </div>

                                <div id="passArea" class="col-md-6">
                                    <label class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                                    <input type="password" id="passwordInput" name="password" class="form-control">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Vai trò</label>
                                    <select id="modalRoleId" name="roleId" class="form-select">
                                        <option value="1">Quản trị viên</option>
                                        <option value="2">Học viên</option>
                                        <option value="3">Giảng viên</option>
                                    </select>
                                </div>

                                <div class="col-md-12 mt-3">
                                    <label class="form-label fw-bold d-block">Trạng thái tài khoản</label>
                                    <div class="form-check form-switch p-0 ms-5">
                                        <input class="form-check-input" type="checkbox" id="modalIsActive" checked style="width: 45px; height: 22px;">
                                        <label class="form-check-label ms-3 fw-semibold text-success" id="statusLabel">Đang hoạt động</label>
                                    </div>
                                    <div id="createdAtContainer">
                                        <small class="text-muted d-block mt-2">Ngày tạo: <span id="createdAtLabel">--/--/----</span></small>
                                    </div>
                                </div>

                                <!-- KHU VỰC HIỂN THỊ KHÓA HỌC -->
                                <div class="col-12 mt-4 px-0" id="courseProgressArea">
                                    <hr class="text-muted opacity-25">
                                    <label class="form-label fw-bold d-block mb-3">
                                        <i class="bi bi-book-half me-2 text-primary"></i>Khóa học & Tiến độ hoàn thành
                                    </label>
                                    <div id="courseProgressContainer" class="row g-3 m-0">
                                        <!-- JS sẽ đổ dữ liệu vào đây -->
                                    </div>
                                </div>
                            </div>
                        </div>
<div class="tab-pane fade" id="tab-history" role="tabpanel" style="min-width: 900px;">
    
    <div class="table-responsive border rounded-3 w-100">
        <table class="table table-hover align-middle mb-0 small w-100">
            <thead class="table-light fw-bold text-muted text-uppercase" style="font-size: 11px;">
                <tr>
                    <th class="ps-3 py-2 text-center" style="width: 5%;">Mã GD</th>
                    <th class="py-2" style="width: 10%;">Số tiền</th>
                    <th class="py-2" style="width: 10%;">Ngân hàng</th>
                    <th class="py-2" style="width: 15%;">Số TK</th>
                    <th class="py-2" style="width: 15%;">Ngày tạo</th>
                    <th class="py-2" style="width: 35%;">Ghi chú</th>
                    <th class="pe-3 py-2 text-center" style="width: 10%;">Trạng thái</th>
                </tr>
            </thead>
            <tbody id="userDetail-history-body">
                </tbody>
        </table>
    </div>
    
    <div id="userDetail-history-pagination" class="mt-3 d-flex justify-content-end w-100"></div>
    
</div>
                
                <div class="modal-footer border-top-0 p-4 pt-0">
                    <button type="button" class="btn btn-light fw-bold" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" id="btnSave" onclick="Manager.save()" class="btn btn-primary fw-bold px-4 shadow-sm">
                        Lưu dữ liệu
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
<div class="modal fade" id="courseManagementModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 15px;">
            
            <div class="modal-header border-bottom-0 pt-4 px-4 pb-0">
                <h5 class="modal-title fw-bold d-flex align-items-center">
                    <div class="bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center me-3 shadow-sm" style="width: 45px; height: 45px;">
                        <i class="bi bi-journal-bookmark-fill fs-5"></i>
                    </div>
                    <span>Tiến độ Học viên</span>
                </h5>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
            </div>
            
            <div class="modal-body p-4">
                <div class="d-flex align-items-center p-3 mb-4 rounded-3 bg-light border border-light-subtle shadow-sm">
                    <div class="flex-grow-1">
                        <label class="form-label small text-muted text-uppercase fw-bold mb-1" style="letter-spacing: 0.5px;">Học viên</label>
                        <div id="managedStudentName" class="fw-bold fs-5 text-dark text-truncate" style="max-width: 250px;">Lê Quang Vinh</div>
                    </div>
                    <div class="badge bg-white text-primary border shadow-sm px-3 py-2 rounded-pill">
                        <i class="bi bi-mortarboard-fill me-1"></i> Đang theo học
                    </div>
                </div>

                <input type="hidden" id="managedUserId">
                
                <label class="form-label small text-muted fw-bold mb-3">
                    <i class="bi bi-collection-play-fill me-2 text-secondary"></i>DANH SÁCH KHÓA HỌC
                </label>
                
                <div id="managedCourseList" class="row g-3" style="max-height: 400px; overflow-y: auto; overflow-x: hidden;">
                    </div>
            </div>
            
            <div class="modal-footer border-top-0 p-4 pt-0">
                <button type="button" class="btn btn-secondary fw-bold px-4 rounded-pill shadow-sm" data-bs-dismiss="modal">Đóng cửa sổ</button>
            </div>
        </div>
    </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twbs-pagination/1.4.2/jquery.twbsPagination.min.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/managerUser.js"></script>
<script src="../assets/js/admin-loader.js"></script>
<script src="../assets/js/global-loader.js"></script>
<script>
    $(document).ready(function () {
    Manager.init();
});
</script>
</html>
