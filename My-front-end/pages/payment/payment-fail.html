<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán không thành công</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: #f8f9fa; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card { 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.08); 
            padding: 50px; 
            text-align: center; 
            max-width: 450px;
            border: none;
        }
        .icon-circle {
            width: 100px;
            height: 100px;
            background: #fff5f5;
            color: #e53e3e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin: 0 auto 20px;
        }
        .btn-retry {
            background-color: #2d3748;
            color: white;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-retry:hover {
            background-color: #1a202c;
            transform: translateY(-2px);
            color: white;
        }
    </style>
</head>
<body>
    <div class="card bg-white">
        <div class="icon-circle">
            <i class="bi bi-x-lg">❌</i>
        </div>
        <h2 class="fw-bold text-dark">Thanh toán thất bại</h2>
        <p class="text-muted mt-3 mb-4">
            Giao dịch không thể hoàn tất do lỗi hệ thống hoặc bác đã hủy bỏ.
        </p>
        
        <div class="d-grid gap-2">
            <a href="/index.html" class="btn btn-retry rounded-pill">Quay lại trang chủ</a>

        </div>
    </div>
</body>
</html>
