<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán thành công</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 40px; text-align: center; max-width: 500px; }
        .icon { font-size: 80px; color: #28a745; line-height: 1; margin-bottom: 20px;}
    </style>
</head>
<body>
    <div class="card bg-white">
        <div class="icon">✔️</div>
        <h2 class="fw-bold mt-3">Thanh toán thành công!</h2>
        <p class="text-secondary">Khóa học đã được mở. Cảm ơn bạn đã tin tưởng!</p>
        <div>
            <a href="/index.html" class="btn btn-outline-secondary rounded-pill px-4 mt-3">Về trang chủ</a>
            
            <a href="#" id="btn-learn-now" class="btn btn-success rounded-pill px-4 mt-3 ms-2">Vào học ngay</a>
        </div>
    </div>

    <script>
        // Khi trang web load xong
        document.addEventListener("DOMContentLoaded", function () {
            // 1. Lấy thông tin từ thanh URL
            const urlParams = new URLSearchParams(window.location.search);
            const courseId = urlParams.get('courseId');

            // 2. Tìm cái nút "Vào học ngay"
            const btnLearnNow = document.getElementById("btn-learn-now");

            // 3. Nếu trên URL có courseId, thì sửa cái link của nút đó
            if (courseId) {
                // Thay đổi đường dẫn này cho khớp với cấu trúc thư mục của bác
                btnLearnNow.href = `/pages/learn/learning.html?courseId=${courseId}`;
            } else {
                // Nếu vì lý do nào đó không có khóa học, thì cho nút này bay về trang hồ sơ học tập của user
                btnLearnNow.href = "/pages/user/my-courses.html";
            }
        });
    </script>
</body>
</html>
