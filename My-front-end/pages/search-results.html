<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả tìm kiếm - LMS Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .course-card { transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; height: 100%; }
        .course-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
        .course-card img { height: 160px; object-fit: cover; }
        .course-title { font-size: 1rem; font-weight: 700; display: -webkit-box;  -webkit-box-orient: vertical; overflow: hidden }
        .instructor-name { font-size: 0.85rem; color: #6c757d; }
        .price-text { font-size: 1.1rem; font-weight: bold; }
        .old-price { font-size: 0.85rem; text-decoration: line-through; color: #6c757d; }
        .filter-section-title { font-size: 0.95rem; font-weight: bold; text-transform: uppercase; color: #495057; margin-bottom: 10px; }
    </style>
</head>
<body>
<div id="header-placeholder"></div>

<div class="container my-4">
    <div class="row mb-4">
        <div class="col-12">
            <h3 class="fw-bold text-dark">
                <span id="totalRecordsCount">0</span> kết quả cho "<span id="displayKeyword" class="text-primary">...</span>"
            </h3>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-3 d-none d-lg-block mb-4">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4"><i class="bi bi-funnel me-2"></i>Bộ lọc</h5>
                 <div class="mb-4">
    <div class="filter-section-title">Trình độ</div>
    
    <div class="form-check mb-2">
        <input class="form-check-input filter-level" type="radio" name="levelGroup" value="" id="level0" checked>
        <label class="form-check-label" for="level0">Tất cả trình độ</label>
    </div>
    
    <div class="form-check mb-2">
        <input class="form-check-input filter-level" type="radio" name="levelGroup" value="1" id="level1">
        <label class="form-check-label" for="level1">Người mới bắt đầu</label>
    </div>
    <div class="form-check mb-2">
        <input class="form-check-input filter-level" type="radio" name="levelGroup" value="2" id="level2">
        <label class="form-check-label" for="level2">Trung cấp</label>
    </div>
    <div class="form-check mb-2">
        <input class="form-check-input filter-level" type="radio" name="levelGroup" value="3" id="level3">
        <label class="form-check-label" for="level3">Nâng cao</label>
    </div>
</div>

<hr class="text-muted">

<div class="mb-2">
    <div class="filter-section-title">Giá</div>
    
    <div class="form-check mb-2">
        <input class="form-check-input filter-price" type="radio" name="priceGroup" value="" id="price0" checked>
        <label class="form-check-label" for="price0">Tất cả</label>
    </div>

    <div class="form-check mb-2">
        <input class="form-check-input filter-price" type="radio" name="priceGroup" value="paid" id="price1">
        <label class="form-check-label" for="price1">Có phí</label>
    </div>
    <div class="form-check mb-2">
        <input class="form-check-input filter-price" type="radio" name="priceGroup" value="free" id="price2">
        <label class="form-check-label" for="price2">Miễn phí</label>
    </div>
</div>
                </div>
            </div>
        </div>

        <div class="col-lg-9">
            
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-muted" id="displayPaginationStatus">Hiển thị 0-0 kết quả</span>
                <div class="d-flex align-items-center">
                    <span class="me-2 text-muted text-nowrap small">Sắp xếp theo:</span>
                    <select id="sortBySelect" class="form-select form-select-sm border-secondary-subtle">
                        <option value="relevant">Liên quan nhất</option>
                        <option value="newest">Mới nhất</option>
                        <option value="price_asc">Giá từ thấp đến cao</option>
                        <option value="price_desc">Giá từ cao xuống thấp</option>
                    </select>
                </div>
            </div>

            <div class="row g-4 mb-5" id="courseResultGrid"></div>

            <nav aria-label="Search results pages">
                <ul class="pagination justify-content-center" id="paginationGrid"></ul>
            </nav>

        </div>
    </div>
</div>
<div id="footer-placeholder"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/notification.js"></script>
<script src="assets/js/common.js"></script>
<script>
    // Đảm bảo cấu hình mảng truyền lên API khớp định dạng C# (levels=1&levels=2 thay vì levels[]=1)
    $.ajaxSettings.traditional = true;

    // --- BỘ NHỚ ĐỆM TOÀN CỤC (CLIENT-SIDE CACHE) ---
    let allCoursesCache = [];  // Nơi lưu trữ toàn bộ dữ liệu gốc tải từ API về
    let filteredCourses = [];  // Nơi lưu trữ dữ liệu sau khi đã qua bộ lọc tại chỗ
    
    let currentKeyword = "";
    let currentPage = 1;
    const pageSize = 6;        // Số lượng bản ghi hiển thị trên một trang giao diện

    $(document).ready(function() {
        // 1. Đọc từ khóa tìm kiếm từ URL thanh địa chỉ
        const urlParams = new URLSearchParams(window.location.search);
        currentKeyword = urlParams.get('keyword') || "";
        
        $('#displayKeyword').text(currentKeyword || "Tất cả khóa học");

        // 2. Tải toàn bộ dữ liệu từ Server về bộ nhớ đệm (Chỉ gọi DUY NHẤT 1 LẦN khi vừa load trang)
        initLoadAllSearchData();

        // 3. 📍 ĐỘT PHÁ SIÊU TỐC: Bấm bộ lọc xử lý trực tiếp dữ liệu trên RAM, vẽ lại DOM 0ms không khựng!
        $('.filter-level, .filter-price, #sortBySelect').on('change', function() {
            currentPage = 1; // Mỗi lần đổi bộ lọc thì reset bắt buộc về trang 1
            applyClientFiltersAndRender(); 
        });

        // 4. Bắt sự kiện khi click chuyển trang trên thanh Phân Trang (Phân trang tại chỗ)
        $(document).on('click', '#paginationGrid .page-link', function(e) {
            e.preventDefault();
            const targetPage = $(this).data('page');
            if (targetPage && targetPage !== currentPage) {
                currentPage = targetPage;
                renderDataWithPagination(); // Cắt mảng vẽ lại trang mới
                window.scrollTo({ top: 0, behavior: 'smooth' }); // Cuộn mượt lên đầu trang
            }
        });
    });

    // HÀM 1: Gọi Server bốc trọn gói cục dữ liệu theo từ khóa về RAM (Chỉ chạy 1 lần)
    async function initLoadAllSearchData() {
        const $grid = $('#courseResultGrid');
        $grid.html('<div class="col-12 text-center my-5"><div class="spinner-border text-primary"></div></div>');

        // Gửi thông số lấy sỉ dữ liệu về Client quản lý
        const requestData = {
            keyword: currentKeyword,
            pageIndex: 1,
            pageSize: 500 // Bốc max 500 khóa học liên quan về luôn cho nhàn đầu
        };

        try {
            const response = await $.get('https://lms-u2jn.onrender.com/api/course/search-result', requestData);
            
            if (response.success && response.data) {
                // Lưu mảng gốc vào bộ nhớ đệm ẩn
                allCoursesCache = response.data.data || [];
                
                // Chạy bộ lọc lần đầu để hiển thị kết quả ban đầu
                applyClientFiltersAndRender();
            } else {
                showErrorUi("Không thể tải danh sách khóa học từ máy chủ.");
            }
        } catch (error) {
            console.error("Lỗi gọi API Search:", error);
            showErrorUi("Lỗi kết nối hệ thống server hoặc CORS!");
        }
    }

    // HÀM 2: Thuật toán lọc dữ liệu cực nhanh trên RAM trình duyệt
    function applyClientFiltersAndRender() {
        // Thu thập mảng Trình độ (Levels) được tích chọn từ Radio
        const selectedLevels = [];
        $('.filter-level:checked').each(function() {
            const val = $(this).val();
            if (val !== "") { 
                selectedLevels.push(parseInt(val));
            }
        });

        // Xác định bộ lọc Giá (IsFree) dựa trên trạng thái radio giá
        const paidChecked = $('#price1').is(':checked');
        const freeChecked = $('#price2').is(':checked');

        // Sàng lọc mảng bằng JavaScript (Tốc độ tính bằng miligiây)
        filteredCourses = allCoursesCache.filter(course => {
            // 1. Lọc theo Trình độ (Nếu mảng selectedLevels rỗng nghĩa là chọn "Tất cả")
            if (selectedLevels.length > 0 && !selectedLevels.includes(course.level)) {
                return false;
            }
            // 2. Lọc theo Giá (Có phí / Miễn phí)
            if (paidChecked && !freeChecked && course.isFree) return false;
            if (!paidChecked && freeChecked && !course.isFree) return false;
            
            return true;
        });

        // 3. Sắp xếp (Sort) mảng tại chỗ dựa trên Selectbox
        const sortBy = $('#sortBySelect').val();
        if (sortBy === 'newest') {
            filteredCourses.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
        } else if (sortBy === 'price_asc') {
            filteredCourses.sort((a, b) => (a.price || 0) - (b.price || 0));
        } else if (sortBy === 'price_desc') {
            filteredCourses.sort((a, b) => (b.price || 0) - (a.price || 0));
        }

        // Cập nhật số lượng tổng bản ghi tìm thấy sau khi lọc
        const totalRecords = filteredCourses.length;
        $('#totalRecordsCount').text(totalRecords);

        // Gọi hàm chia trang, cắt mảng và đổ ra HTML công khai
        renderDataWithPagination();
    }

    // HÀM 3: Cắt mảng hiển thị theo phân đoạn từng trang giao diện
    function renderDataWithPagination() {
        const totalRecords = filteredCourses.length;
        const totalPages = Math.ceil(totalRecords / pageSize);
        
        // Cắt mảng lấy đúng 6 phần tử tương ứng của trang hiện tại
        const startItemIndex = (currentPage - 1) * pageSize;
        const endItemIndex = startItemIndex + pageSize;
        const pageData = filteredCourses.slice(startItemIndex, endItemIndex);

        // Cập nhật dòng trạng thái phân trang (Ví dụ: Hiển thị 1-6 của 12 kết quả)
        const displayStart = totalRecords === 0 ? 0 : startItemIndex + 1;
        const displayEnd = Math.min(endItemIndex, totalRecords);
        $('#displayPaginationStatus').text(`Hiển thị ${displayStart}-${displayEnd} của ${totalRecords} kết quả`);

        // Vẽ Card thật và vẽ nút điều hướng phân trang mới
        renderCourseCards(pageData);
        renderPagination(totalPages, currentPage);
    }

    // HÀM VẼ CARD: Đập đi xây lại tức thì (0ms) vì dữ liệu luôn có sẵn trên RAM để render lập tức
    function renderCourseCards(courses) {
        const $grid = $('#courseResultGrid');
        $grid.empty(); // Xóa sạch rác và card cũ đi

        if (!courses || courses.length === 0) {
            $grid.html('<div class="col-12 text-center text-muted my-5"><i class="bi bi-folder-x display-4"></i><p class="mt-2">Không tìm thấy khóa học nào khớp với bộ lọc của bạn.</p></div>');
            return;
        }

        courses.forEach(course => {
            let badgeHtml = '';
            let priceHtml = '';

            // Kiểm tra thuộc tính hiển thị Badge
            if (course.isFree) {
                badgeHtml = `<span class="badge bg-success fw-bold position-absolute top-0 start-0 m-2 shadow-sm">MIỄN PHÍ</span>`;
                priceHtml = `<span class="price-text text-success">MIỄN PHÍ</span>`;
            } else {
                badgeHtml = `<span class="badge bg-primary fw-bold position-absolute top-0 start-0 m-2 shadow-sm">PRO</span>`;
                priceHtml = `<span class="price-text text-danger">${course.price.toLocaleString('vi-VN')}đ</span>`;
            }

            const studentCount = course.studentCount || 0;
            const lessonCount = course.lessonCount || 0;
            const duration = course.duration || "0 giờ";

            const cardHtml = `
                <div class="col-md-6 col-xl-4">
                    <div class="card border-0 shadow-sm course-card h-100" onclick="window.location.href='course-detail.html?id=${course.id}'">
                        <div class="position-relative">
                            <img src="${course.thumbnailUrl}" class="card-img-top" alt="Course Thumbnail">
                            ${badgeHtml}
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h5 class="course-title text-dark mb-2">${course.title}</h5>
                            <div class="instructor-name mb-3">Giảng viên: ${course.instructorName}</div>
                            
                            <div class="d-flex align-items-center gap-3 mt-auto mb-3 small text-muted">
                                <span title="Số học viên tham gia"><i class="bi bi-people me-1"></i>${studentCount}</span>
                                <span title="Tổng số bài học"><i class="bi bi-journal-text me-1"></i>${lessonCount} bài</span>
                                <span title="Tổng thời lượng"><i class="bi bi-clock me-1"></i>${duration}</span>
                            </div>

                            <div class="pt-3 border-top d-flex justify-content-between align-items-center">
                                ${priceHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            $grid.append(cardHtml);
        });
    }

    function renderPagination(totalPages, activePage) {
        const $pager = $('#paginationGrid');
        $pager.empty();

        if (totalPages <= 1) return;

        $pager.append(`
            <li class="page-item ${activePage === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" data-page="${activePage - 1}" tabindex="-1"><i class="bi bi-chevron-left"></i> Lùi</a>
            </li>
        `);

        for (let i = 1; i <= totalPages; i++) {
            $pager.append(`
                <li class="page-item ${activePage === i ? 'active' : ''}">
                    <a class="page-link" href="#" data-page="${i}">${i}</a>
                </li>
            `);
        }

        $pager.append(`
            <li class="page-item ${activePage === totalPages ? 'disabled' : ''}">
                <a class="page-link" href="#" data-page="${activePage + 1}">Tiến <i class="bi bi-chevron-right"></i></a>
            </li>
        `);
    }

    function showErrorUi(msg) {
        $('#courseResultGrid').html(`<div class="col-12 text-center text-danger my-5"><p>${msg}</p></div>`);
    }
</script>
</body>
</html>
