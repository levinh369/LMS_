<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thùng rác Chương - LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-color: #4e73df; 
            --danger-color: #f1416c; 
            --success-color: #10b981; 
            --bg-body: #f8f9fc;
        }
        body { 
            background-color: var(--bg-body); 
            font-family: 'Inter', sans-serif; 
            color: #3f4254;
        }
        .card { 
            border: none; 
            border-radius: 1rem; 
            box-shadow: 0 0.1rem 1.5rem 0 rgba(0, 0, 0, 0.05); 
            overflow: hidden;
        }
        .trash-header { 
            background-color: #ffffff; 
            color: #3f4254; /* Chữ xám đậm cho dễ đọc */
            padding: 1.5rem 2rem; 
            border-radius: 15px; 
            border-left: 6px solid var(--danger-color); /* Viền đỏ bên trái */
            margin-bottom: 1.5rem; 
        }

        /* Thêm xíu CSS cho cái text-muted trong header */
        .trash-header .text-muted {
            color: #a1a5b7 !important;
        }
        .table thead th { 
            background-color: #f9fafb;
            text-transform: uppercase; 
            font-size: 0.75rem; 
            font-weight: 700; 
            color: #a1a5b7; 
            border-bottom: 1px solid #eff2f5;
            padding: 1rem 0.75rem;
        }
        .symbol-label {
            width: 45px; height: 45px; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 12px; font-weight: 700;
        }
        /* Button Styles */
        .btn-action {
            width: 35px; height: 35px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 8px; border: none; transition: all 0.2s;
        }
        .btn-restore { background-color: #e8fff3; color: var(--success-color); }
        .btn-restore:hover { background-color: var(--success-color); color: white; }
        
        .btn-hard-delete { background-color: #fff5f8; color: var(--danger-color); }
        .btn-hard-delete:hover { background-color: var(--danger-color); color: white; }
        
        .badge-order { background-color: #eef3ff; color: #4e73df; padding: 0.5rem 0.75rem; border-radius: 6px; font-weight: 600; }
    </style>
</head>
<body>
    <div id="sidebar-placeholder"></div>
<div class="container py-5">
    
    <div class="trash-header shadow-sm bg-white p-4 mb-4" style="border-radius: 15px; border-left: 6px solid #dc3545;">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1"><i class="bi bi-trash3-fill me-2 text-danger"></i>THÙNG RÁC CHƯƠNG HỌC</h3>
                <p class="text-muted small mb-0">Quản lý các chương đã tạm xóa. Bạn có thể khôi phục hoặc xóa vĩnh viễn.</p>
            </div>
            <a href="/course/index.html" class="btn btn-outline-secondary rounded-pill px-4 fw-bold">
                <i class="bi bi-arrow-left"></i> QUAY LẠI
            </a>
        </div>

        <div class="row g-3 align-items-end">
            <div class="col-md-5"> 
                <div class="position-relative">
                    <label class="form-label fw-bold small text-muted">Tìm theo tiêu đề</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" id="chapterTrashKeySearch" class="form-control bg-light border-start-0" placeholder="Nhập tiêu đề chương học...">
                    </div>
                    
                 
                </div>
            </div>
           <div class="col-md-2">
    <div class="d-flex gap-2">
        <button onclick="chapter.chapterTrash.resetFilter()" class="btn btn-outline-secondary btn-sm flex-fill fw-bold rounded-pill shadow-sm" title="Xóa bộ lọc" style="height: 31px; line-height: 1;">
            <i class="bi bi-arrow-clockwise me-1"></i> LÀM MỚI
        </button>
        
        <button onclick="chapter.chapterTrash.loadData(1)" class="btn btn-primary btn-sm flex-fill fw-bold rounded-pill shadow-sm" style="height: 31px; line-height: 1;">
            <i class="bi bi-funnel-fill me-1"></i> LỌC
        </button>
    </div>
</div>
        </div>
    </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="ps-4" style="width: 80px">ID</th>
                                <th>Tiêu đề chương</th>
                                <th style="width: 120px">Thứ tự</th>
                                <th style="width: 120px">Trạng thái</th>
                                <th style="width: 150px">Ngày xóa tạm</th>
                                <th class="text-end pe-4" style="width: 120px">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="chapterTrashData">
                            <!-- JS render here -->
                        </tbody>
                    </table>
                </div>
            </div>
           <div class="p-4 d-flex justify-content-between align-items-center border-top">
                <div class="text-muted small">Tổng số: <strong id="total-records">0</strong> bản ghi</div>
                <nav><ul id="paging-ul" class="pagination pagination-sm m-0"></ul></nav>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twbs-pagination/1.4.2/jquery.twbsPagination.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Giả định các file JS nghiệp vụ của bạn -->
    <script src="../assets/js/admin-loader.js"></script>
    <script src="../assets/js/chapter.js"></script>
    <script src="../assets/js/global-loader.js"></script>
    <script>
        $(document).ready(function() {

                chapter.chapterTrash.init();
        });
    </script>
</body>
</html>
