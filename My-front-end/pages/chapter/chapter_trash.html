<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thùng rác Chương - LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-color: #4e73df; 
            --danger-color: #f1416c; 
            --success-color: #10b981; 
            --bg-body: #f8f9fc;
        }
        body { 
            background-color: var(--bg-body); 
            font-family: 'Inter', sans-serif; 
            color: #3f4254;
        }
        .card { 
            border: none; 
            border-radius: 1rem; 
            box-shadow: 0 0.1rem 1.5rem 0 rgba(0, 0, 0, 0.05); 
            overflow: hidden;
        }
        .trash-header { 
            background: linear-gradient(135deg, #1e1e2d 0%, #3f4254 100%); 
            color: white; 
            padding: 2.5rem; 
            border-radius: 1rem; 
            margin-bottom: 2rem; 
        }
        .table thead th { 
            background-color: #f9fafb;
            text-transform: uppercase; 
            font-size: 0.75rem; 
            font-weight: 700; 
            color: #a1a5b7; 
            border-bottom: 1px solid #eff2f5;
            padding: 1rem 0.75rem;
        }
        .symbol-label {
            width: 45px; height: 45px; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 12px; font-weight: 700;
        }
        /* Button Styles */
        .btn-action {
            width: 35px; height: 35px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 8px; border: none; transition: all 0.2s;
        }
        .btn-restore { background-color: #e8fff3; color: var(--success-color); }
        .btn-restore:hover { background-color: var(--success-color); color: white; }
        
        .btn-hard-delete { background-color: #fff5f8; color: var(--danger-color); }
        .btn-hard-delete:hover { background-color: var(--danger-color); color: white; }
        
        .badge-order { background-color: #eef3ff; color: #4e73df; padding: 0.5rem 0.75rem; border-radius: 6px; font-weight: 600; }
    </style>
</head>
<body>
    <div id="sidebar-placeholder"></div>
    <div class="container py-5">
        <div class="trash-header d-flex justify-content-between align-items-center shadow-sm">
            <div>
                <h1 class="h3 mb-1 fw-bold"><i class="bi bi-trash3-fill me-2 text-danger"></i> Thùng rác Chương</h1>
                <p class="mb-0 opacity-75">Quản lý và khôi phục các chương học đã xóa tạm thời</p>
            </div>
            <a href="chapter_index.html" class="btn btn-light fw-bold px-4">
                <i class="bi bi-arrow-left me-2"></i>Quay lại
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="ps-4" style="width: 80px">ID</th>
                                <th>Tiêu đề chương</th>
                                <th style="width: 150px">Thứ tự</th>
                                <th style="width: 180px">Ngày xóa tạm</th>
                                <th class="text-end pe-4" style="width: 120px">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="chapterTrashData">
                            <!-- JS render here -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="p-4 d-flex justify-content-between align-items-center border-top bg-light-subtle">
                <div class="text-muted small">Hiển thị: <strong id="total-records">0</strong> chương học</div>
                <nav><ul id="paging-ul" class="pagination pagination-sm m-0"></ul></nav>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twbs-pagination/1.4.2/jquery.twbsPagination.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Giả định các file JS nghiệp vụ của bạn -->
    <script src="../assets/js/admin-loader.js"></script>
    <script src="../assets/js/chapter.js"></script>
    <script>
        $(document).ready(function() {

                chapter.chapterTrash.init();
        });
    </script>
</body>
</html>
