<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thùng rác Chương - LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary-color: #4e73df; --danger-color: #e74a3b; }
        body { background-color: #f8f9fc; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 0.75rem; box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15); }
        .table thead th { background-color: #f1f4f9; text-transform: uppercase; font-size: 0.8rem; font-weight: 700; color: #4e73df; border: none; }
        .trash-header { background: linear-gradient(135deg, #e74a3b 0%, #be2617 100%); color: white; padding: 2rem; border-radius: 0.75rem; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <div id="sidebar-placeholder"></div>
<div class="container py-5">
    <div class="trash-header d-flex justify-content-between align-items-center shadow">
        <div>
            <h1 class="h3 mb-1 fw-bold"><i class="bi bi-trash3-fill me-2"></i> Thùng rác Chương</h1>
            <p class="mb-0 opacity-75">Danh sách các chương học đã xóa mềm</p>
        </div>
        <a href="chapter_index.html" class="btn btn-light fw-bold shadow-sm">
            <i class="bi bi-arrow-left me-1"></i> Quay lại
        </a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Tiêu đề chương</th>
                            <th>Thứ tự</th>
                            <th>Ngày tạo</th>
                            <th class="text-end pe-4">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="chapterTrashData">
                        </tbody>
                </table>
            </div>
        </div>
        <div class="p-4 d-flex justify-content-between align-items-center border-top">
            <div class="text-muted small">Tổng số: <strong id="total-records">0</strong> chương học</div>
            <nav><ul id="paging-ul" class="pagination pagination-sm m-0"></ul></nav>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twbs-pagination/1.4.2/jquery.twbsPagination.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/admin-loader.js"></script>
    <script src="../assets/js/chapter.js"></script>
    <script>
        $(document).ready(function() {
            if (typeof Chapter !== 'undefined' && Chapter.chapterTrash) {
                Chapter.chapterTrash.init();
            }
        });
    </script>
</body>
</html>
