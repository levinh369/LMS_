<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đang xử lý đăng nhập...</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../assets/js/common.js"></script> 
</head>
<body>
    <script>
    const params = new URLSearchParams(window.location.search);
    
    const authData = {
        accessToken: params.get('token'),
        refreshToken: params.get('refreshToken') || "", 
        userId: params.get('userId'),
        username: params.get('username'),
        avatarUrl: params.get('avatar'),
        role: params.get('role'), // 📍 Hứng RoleId (ví dụ: 1, 2, 3) từ Render bắn về
        email: params.get('email')
    };

    if (authData.accessToken && authData.userId) {
        // 1. Lưu toàn bộ dữ liệu vào localStorage sạch sẽ
        AuthHelper.saveAuth(authData);
        
        // Kiểm tra xem có đang trong luồng click ghi danh khóa học từ ngoài vào không
        const courseId = params.get('id'); 
        const roleId = parseInt(authData.role || 0);

        // 2. ĐIỀU HƯỚNG THÔNG MINH THEO ROLE ĐỒNG BỘ VỚI HÀM LOGIN THƯỜNG
        setTimeout(() => {
            if (courseId) {
                // Ưu tiên 1: Đang mua dở khóa học -> Vào thẳng lớp học
                window.location.href = `/learn/learning.html?id=${courseId}`;
            } else {
                // Ưu tiên 2: Điều hướng theo phân quyền vai trò
                if (roleId === 1) {
                    window.location.href = "/Dashboard/index.html";              // Admin -> Thống kê
                } else if (roleId === 3) {
                    window.location.href = "/Dashboard/Dashboard-teacher.html";  // Teacher -> Quản lý lớp
                } else {
                    window.location.href = "/index.html";                        // Student/Guest -> Trang chủ
                }
            }
        }, 500);

    } else {
        alert("Lỗi dữ liệu xác thực từ mạng xã hội!");
        window.location.href = "/auth/login.html";
    }
</script>
</body>
</html>
