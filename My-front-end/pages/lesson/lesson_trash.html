<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thùng rác Bài học - LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fc; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 1rem; box-shadow: 0 0.5rem 2rem 0 rgba(0,0,0,0.1); }
        .table thead th { background-color: #f8f9fc; border-bottom: 2px solid #e3e6f0; color: #4e73df; font-weight: bold; font-size: 0.85rem; }
        .video-id-badge { font-family: monospace; background-color: #eaecf4; padding: 0.2rem 0.5rem; border-radius: 0.25rem; font-size: 0.8rem; }
        .chapter-name { color: #858796; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="container-fluid py-5 px-4">
    <div class="row mb-4 align-items-end">
        <div class="col-md-6">
            <h2 class="fw-bold text-gray-800"><i class="bi bi-play-circle-fill text-danger me-2"></i>Thùng rác Bài học</h2>
        </div>
        <div class="col-md-6 text-end">
            <a href="lesson_index.html" class="btn btn-secondary shadow-sm"><i class="bi bi-list-ul me-1"></i> Danh sách</a>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="ps-3">Bài học</th>
                            <th>Chương học</th>
                            <th>Thông tin Video</th>
                            <th>Thời lượng</th>
                            <th>Xem trước</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="lessonTrashData">
                        </tbody>
                </table>
            </div>
        </div>
        <div class="p-4 d-flex justify-content-between align-items-center border-top">
            <div class="text-muted small">Tổng số: <strong id="total-records">0</strong> bài học</div>
            <nav><ul id="paging-ul" class="pagination pagination-sm m-0"></ul></nav>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twbs-pagination/1.4.2/jquery.twbsPagination.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/admin-loader.js"></script>
    <script src="../assets/js/lesson.js"></script>
    <script>
        $(document).ready(function() {
            if (typeof Lesson !== 'undefined' && Lesson.lessontrash) {
                Lesson.lessontrash.init();
            }
        });
    </script>
</body>
</html>
